quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:docpass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.flyway.migrate-at-start=false

docpass.seguranca.api-empresas.ativo=false

mp.messaging.incoming.perfil_atualizado_in.enabled=false
mp.messaging.incoming.documento_enviado_in.enabled=false
mp.messaging.incoming.consentimento_concedido_in.enabled=false
